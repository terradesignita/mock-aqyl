openapi: 3.1.0
info:
  title: Knowledge Platform API
  version: 1.1.0
servers:
  - url: /api/v1
paths:
  /ingestion/uploads:
    post:
      summary: Upload content for ingestion
      operationId: createUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, file_name, content_type, classification]
              properties:
                source: { type: string }
                file_name: { type: string }
                content_type: { type: string }
                classification: { type: string, enum: [public, internal, confidential, restricted] }
      responses:
        '200':
          description: Upload accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  upload_id: { type: string }
                  document_id: { type: string }
                  status: { type: string }
  /cards/{id}/ask:
    post:
      summary: Ask question in card context
      operationId: askCard
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, language]
              properties:
                question: { type: string }
                language: { type: string, enum: [ru, en, kk, uz, az] }
                strict_grounded: { type: boolean, default: true }
      responses:
        '200':
          description: Grounded answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer: { type: string }
                  confidence: { type: number }
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        chunk_id: { type: string }
                        anchor: { type: string }
                        score: { type: number }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
